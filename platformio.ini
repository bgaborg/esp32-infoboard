[env:fnk0104b]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:config.py
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; TFT_eSPI pins, from Freenove FNK0104AB_2.8_240x320_ILI9341.h
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_INVERSION_ON
  -DTFT_BL=45
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_MISO=13
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=46
  -DTFT_RST=-1
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DSPI_FREQUENCY=40000000
  -DUSE_HSPI_PORT
